name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib

  test:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        node: [22]
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Enable corepack
        run: corepack enable

      - name: Locks cache
        uses: actions/cache@v4
        with:
          path: test/e2e/__locks__
          key: ${{ runner.os }}-node-${{ matrix.node }}-e2e-locks-${{ hashFiles('package.json', 'yarn.lock', 'test/e2e/**/*.spec.ts', 'test/e2e/**/package.json', 'test/e2e/jest.setup.ts') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-e2e-locks-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: lib
          path: lib

      - name: Run unit tests
        run: yarn test:unit

      - name: Run e2e tests
        run: yarn test:e2e
